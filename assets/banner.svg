<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="NHD16 — security researcher: smart contracts and web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff14" opacity="0.035"/>
    </pattern>
    <clipPath id="l1"><rect x="24" y="52" height="22" width="0"><animate attributeName="width" from="0" to="812" dur="0.6s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="24" y="78" height="130" width="0"><animate attributeName="width" from="0" to="812" dur="0.5s" begin="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="24" y="212" height="22" width="0"><animate attributeName="width" from="0" to="812" dur="0.9s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="24" y="236" height="22" width="0"><animate attributeName="width" from="0" to="812" dur="0.9s" begin="2.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="860" height="300" rx="10" fill="url(#bg)" stroke="#1f6f2b" stroke-width="1.5"/>
  <rect width="860" height="300" rx="10" fill="url(#scan)"/>

  <!-- title bar -->
  <path d="M0 10a10 10 0 0 1 10-10h840a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">nhd16@kali: ~/loot</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" xml:space="preserve">
    <g clip-path="url(#l1)">
      <text x="28" y="68"><tspan fill="#58a6ff">nhd16@kali</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~/loot</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    </g>

    <g clip-path="url(#l2)" fill="#39ff14" font-size="17" font-weight="700">
      <text x="28" y="100">███╗   ██╗██╗  ██╗██████╗  ██╗ ██████╗ </text>
      <text x="28" y="119">████╗  ██║██║  ██║██╔══██╗███║██╔════╝ </text>
      <text x="28" y="138">██╔██╗ ██║███████║██║  ██║╚██║███████╗ </text>
      <text x="28" y="157">██║╚██╗██║██╔══██║██║  ██║ ██║██╔═══██╗</text>
      <text x="28" y="176">██║ ╚████║██║  ██║██████╔╝ ██║╚██████╔╝</text>
      <text x="28" y="195">╚═╝  ╚═══╝╚═╝  ╚═╝╚═════╝  ╚═╝ ╚═════╝ </text>
    </g>

    <g clip-path="url(#l3)">
      <text x="28" y="228"><tspan fill="#39ff14">[+]</tspan><tspan fill="#e6edf3"> role   : security researcher / bug hunter</tspan></text>
    </g>
    <g clip-path="url(#l4)">
      <text x="28" y="252"><tspan fill="#39ff14">[+]</tspan><tspan fill="#e6edf3"> scope  : smart contracts (web3) </tspan><tspan fill="#8b949e">&amp;&amp;</tspan><tspan fill="#e6edf3"> web applications (web2)</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.9s" fill="freeze"/>
      <text x="28" y="278"><tspan fill="#58a6ff">nhd16@kali</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#d2a8ff">~/loot</tspan><tspan fill="#8b949e">$ </tspan></text>
      <rect x="190" y="264" width="9" height="17" fill="#39ff14">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
